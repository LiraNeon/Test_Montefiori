<main>
  <h1>Gestión de registros desde Excel</h1>

  <app-carga-archivo (cargado)="cargarRegistros()" />

  @if (error()) {
    <p class="mensaje error">{{ error() }}</p>
  }

  @if (cargando()) {
    <p>Cargando registros...</p>
  } @else {
    <app-listado-registros
      [registros]="registros()"
      [eliminando]="eliminando()"
      [editandoId]="editandoId()"
      (editar)="editandoId.set($event)"
      (cancelar)="editandoId.set(null)"
      (guardar)="guardar($event)"
      (eliminar)="eliminar($event)"
    />
  }
</main>
